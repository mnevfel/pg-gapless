name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        postgres: [15, 17, 18]
        pg: [lockfile]
        include:
          # The oldest pg the peer range allows.
          - node: 22
            postgres: 15
            pg: 8.8.0
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.pg != 'lockfile'
        run: npm install --no-save pg@${{ matrix.pg }}
      - run: npm run types
      - run: npm test
      - name: Mutation check
        if: matrix.node == 24 && matrix.postgres == 18 && matrix.pg == 'lockfile'
        run: npm run mutate
